<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hairsplitting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <style>
    /* scrolly, no snapping: the hair and its sentence stay pinned, and the steps are just stretches of scrolling
       that drive them (see onScroll) */
    body{ font-family: 'Inter', Arial, sans-serif; background: #FAF8F3; color: #000; }
    .inner{ max-width: none; padding: 0; }
    .slide{ height: 100vh; } /* scrolling one of these plays its step: a full window height */
    .split-step{ height: 20vh; } /* past the third step, each of these splits the hair once more: 10 splits per 2 screens */
    .steps-end{ height: 100vh; } /* room for the last step to reach the top */
    .sentence{
      font-size: 28px;
      font-weight: 300;
      line-height: 1.5;
      text-align: center;
      margin: 0;
      max-width: 640px;
    }
    .sentence b{ font-weight: 900; } /* the numbers, extra bold */
    /* the hair: a thick black line pinned at the top center, down to the middle of the screen,
       drawn as two halves side by side that unzip from the bottom up (see drawHair) */
    .hair{
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50vh;
      height: 50dvh;
      pointer-events: none;
    }
    .hair path{ fill: #000; }
    /* the sentence for the step on screen, pinned just under the hair, clear of the progress dots on the left:
       a step's own sentence while it is the current one (see onScroll), or the caption for the split steps */
    .slide .sentence{ display: none; }
    .slide .sentence.on{ display: block; }
    .caption[hidden]{ display: none; }
    .caption, .slide .sentence{
      position: fixed;
      top: calc(50vh + 32px);
      top: calc(50dvh + 32px);
      left: 72px;
      right: 24px;
      margin: 0 auto;
    }
    /* progress dots down the left side, one per step; every step up to the one on screen is filled in */
    .progress{
      position: fixed;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .progress button{
      all: unset;
      cursor: pointer;
      box-sizing: border-box;
      width: 10px;
      height: 10px;
      border: 1.5px solid #000;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .progress button.done{ background: #000; }
    /* the short split steps get smaller dots, centered under the big ones */
    .progress button.mini{ width: 6px; height: 6px; border-width: 1px; align-self: center; }
    @media (max-width: 760px){
      .sentence{ font-size: 22px; }
      .caption, .slide .sentence{ left: 40px; }
      .progress{ left: 12px; gap: 7px; }
      .progress button{ width: 8px; height: 8px; }
      .progress{ gap: 5px; }
      .progress button.mini{ width: 5px; height: 5px; }
    }
  </style>
</head>
<body>
  <nav class="progress" aria-label="Steps"></nav>
  <p class="sentence caption"></p>
  <svg class="hair" aria-hidden="true"><path class="hair-left"></path><path class="hair-right"></path></svg>
  <div class="inner">
    <section class="slide">
      <p class="sentence">There are about <b>1,000,000</b> atoms<br>across <b>1</b> strand of hair.</p>
    </section>

    <section class="slide">
      <p class="sentence">If we split a hair in half, it is 500,000 atoms.</p>
    </section>

    <section class="slide">
      <p class="sentence">And if we split it again, it is 250,000 atoms.</p>
    </section>

    <div class="splits"></div>

    <!-- last: zoom in on the right strand, the left fading out, with no more splitting -->
    <section class="slide"></section>
    <div class="steps-end"></div>
  </div>

  <script>
    // ---- the steps: three with sentences, then short split steps, one more split each, then a last zoom ----
    const TOTAL_SPLITS = 20; // a million halved 20 times is about one atom
    const splits = document.querySelector(".splits");
    for (let n = 3; n <= TOTAL_SPLITS; n++) {
      splits.appendChild(Object.assign(document.createElement("div"), { className: "split-step" }));
    }
    const steps = [...document.querySelectorAll(".slide, .split-step")]; // in page order
    const caption = document.querySelector(".caption");

    // progress dots: one per step, small ones for the split steps, filled up to the one on screen;
    // clicking a dot jumps to its step
    const dots = steps.map((step, i) => {
      const dot = Object.assign(document.createElement("button"), { type: "button", className: step.classList.contains("split-step") ? "mini" : "" });
      dot.setAttribute("aria-label", "Step " + (i + 1));
      dot.addEventListener("click", () => step.scrollIntoView({ behavior: "smooth" }));
      document.querySelector(".progress").appendChild(dot);
      return dot;
    });

    // the hair follows the scroll exactly: step n's split is complete when step n reaches the top of the window,
    // and between two steps it is part way there, in proportion to how far you have scrolled between them
    function onScroll() {
      const tops = steps.map((step) => step.getBoundingClientRect().top + scrollY);
      const y = scrollY + 1; // a pixel of slack so a step scrolled exactly to the top counts as reached
      let split = 0;
      while (split < tops.length - 1 && tops[split + 1] <= y) split++;
      const between = split < tops.length - 1 ? Math.max(0, (y - 1 - tops[split]) / (tops[split + 1] - tops[split])) : 0;
      pose = poseFor(split) + between * (poseFor(split + 1) - poseFor(split));
      // the pinned sentence: a step's own, or on a split step, what is left: a million atoms halved once per split,
      // and on the last split, down to about one atom, the sum of it; a step with no words keeps the one before it
      let from = split;
      while (from > 0 && steps[from].classList.contains("slide") && !steps[from].querySelector(".sentence")) from--;
      const sentence = steps[from].querySelector(".sentence");
      document.querySelectorAll(".slide .sentence").forEach((p) => p.classList.toggle("on", p.closest(".slide") === steps[from]));
      caption.hidden = Boolean(sentence); // a step's own sentence is shown in place
      if (!sentence) {
        caption.textContent = from === TOTAL_SPLITS
          ? "If you split a hair in half and the half in half " + TOTAL_SPLITS + " times, the width is 1 atom."
          : "And again, " + Math.round(1e6 / 2 ** from).toLocaleString() + " atoms.";
      }
      drawHair();
      dots.forEach((dot, i) => {
        dot.classList.toggle("done", i <= split);
        if (i === split) dot.setAttribute("aria-current", "step"); else dot.removeAttribute("aria-current");
      });
    }

    // ---- the hair: each half is 16px thick; unzipped, they sit 32px apart; then we zoom in on the right one ----
    const HALF = 16, APART = 16; // how far each half moves out from where it started
    const hair = document.querySelector(".hair");
    // the whole animation is one timeline, set by the scroll position (see onScroll):
    // 0 to 1 unzips, then every two more zoom in on the right half (first half) and unzip it again (second half)
    // past the last split, the next step only zooms in on the right strand, and after that it stays put
    const poseFor = (split) => (split === 0 ? 0 : split <= TOTAL_SPLITS ? 2 * split - 1 : 2 * TOTAL_SPLITS);
    let pose = 0;

    // unzip runs 0 (joined) to 1 (fully apart). The zip point climbs from the bottom of the line to past the top;
    // below it each half bends out in one gentle arc to its full distance over most of the line, above it they still touch
    function drawHair() {
      // once zoomed, the right half is the size and place of the hair we started with, so each later split
      // just draws a fresh hair unzipping
      const splitPose = Math.min(pose, 2 * TOTAL_SPLITS);
      let unzip = Math.min(splitPose, 1), zoom = 0;
      if (splitPose > 1) {
        const r = (splitPose - 1) % 2 || 2; // 0 to 2 within this zoom-and-split; landing exactly on a split counts as its end
        unzip = r <= 1 ? 1 : r - 1;
        zoom = r <= 1 ? r : 0;
      }
      const w = hair.clientWidth, h = hair.clientHeight;
      const curve = h * 0.8;
      const zip = h - unzip * (h + curve);
      const ease = (x) => 1 - (1 - x) * (1 - x); // opens straight away at the zip point, then levels off: a single bend, no S
      const out = (y) => APART * ease(Math.min(1, Math.max(0, (y - zip) / curve)));
      const ys = [];
      for (let y = 0; y < h; y += 4) ys.push(y);
      ys.push(h);
      // zoom: widen everything 2x around the right half, sliding that half to the center,
      // so it ends up the size and place of the whole hair we started with; the line keeps its length
      const z = zoom * zoom * (3 - 2 * zoom);
      const focus = w / 2 + APART + HALF / 2;
      const zoomX = (x) => focus + z * (w / 2 - focus) + (x - focus) * (1 + z);
      // one half's outline: down its inner edge, back up its outer edge; side is -1 for left, 1 for right
      const outline = (side) => {
        const inner = ys.map((y) => [zoomX(w / 2 + side * (out(y) - 0.5)), y]); // 0.5px overlap so no seam shows while joined
        const outer = ys.map((y) => [zoomX(w / 2 + side * (out(y) + HALF)), y]).reverse();
        return "M" + inner.concat(outer).map(([x, y]) => x.toFixed(1) + "," + y.toFixed(1)).join("L") + "Z";
      };
      hair.querySelector(".hair-left").setAttribute("d", outline(-1));
      hair.querySelector(".hair-left").style.opacity = 1 - z; // the left half fades away as we zoom past it
      hair.querySelector(".hair-right").setAttribute("d", outline(1));
    }

    window.addEventListener("resize", onScroll);
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  </script>
</body>
</html>
