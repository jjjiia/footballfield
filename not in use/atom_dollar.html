<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atoms as Dollars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <style>
    /* one screen: a few sentences, stacked and centered */
    html, body{ background: #FAF8F3; color: #000; }
    body{ font-family: 'Inter', Arial, sans-serif; margin: 0; }
    .page{
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 32px;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .sentence{
      font-size: 28px;
      font-weight: 300;
      line-height: 1.5;
      text-align: center;
      margin: 0;
      max-width: 640px;
    }
    @media (max-width: 760px){
      .sentence{ font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- a typical beach grain of sand, about 0.5 mm, is about 5 × 10^18 atoms (somewhere from 10^18 to 10^19, by its size);
         all the money in the world, global broad money, is about $144 trillion (Voronoi, December 2025), so about 35,000 times.
         (All the wealth in the world, about $471 trillion, UBS Global Wealth Report 2025, would be about 10,000 times) -->
    <p class="sentence">If an atom was a dollar, then a grain of sand would be all the money in the world × 35,000.</p>
  </div>
</body>
</html>
