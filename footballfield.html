}

}

<script>
mapboxgl.accessToken = "pk.eyJ1IjoiampqaWlhMTIzIiwiYSI6ImNpbDQ0Z2s1OTN1N3R1eWtzNTVrd29lMDIifQ.gSWjNbBSpIFzDXU2X5YCiQ"

const STYLE = "mapbox://styles/jjjiia123/cmmb9euid00at01qr9mbfapn7";
const INITIAL_CENTER = [-121.96979950341608, 37.403187791716775]; // Hoboken-ish; change me

const ftToM = (ft) => ft * 0.3048;

// Selectable comparison units (dropdown label, singular/plural wording,
// real-world footprint, and the `place` lat/lng/zoom/bearing the map flies
// to when picked) live in units.json, tuned with football_tester.html,
// rather than inline here. Populated once fetched, below.
let UNITS = [];

function unitFootprintMeters(unit) {
  return unit.widthFt != null
    ? { widthM: ftToM(unit.widthFt), heightM: ftToM(unit.lengthFt) }
    : { widthM: unit.widthM, heightM: unit.lengthM };
}

// The unit's own true area -- widthM*heightM only holds for a rectangle;
// a pentagon (or any other non-rectangular shape added later) needs its
// own formula so the "X of these fit in view" count stays correct.
function unitAreaM2(unit) {
  if (unit.shape === "polygon") return unit.areaM2; // drawn shape, area worked out when drawn
  const { widthM, heightM } = unitFootprintMeters(unit);
  if (unit.shape === "pentagon") {
    const side = widthM; // side length, per makeFieldFeature's convention
    return (1 / 4) * Math.sqrt(5 * (5 + 2 * Math.sqrt(5))) * side * side;
  }
  return widthM * heightM;
}

// Units are grouped into a small category hierarchy (squares, parks,
// sports, buildings) -- rendered as <optgroup>s in this fixed order so the
// dropdown reads as organized rather than one flat list.
const CATEGORY_LABELS = { squares: "Squares", parks: "Parks", sports: "Sports", buildings: "Buildings" };
const CATEGORY_ORDER = ["squares", "parks", "sports", "buildings"];

function populateUnitSelect(selectEl, units) {
  selectEl.innerHTML = "";
  CATEGORY_ORDER.forEach((cat) => {
    const inCategory = units.filter((u) => u.category === cat);
    if (!inCategory.length) return;
    const group = document.createElement("optgroup");
    group.label = CATEGORY_LABELS[cat] || cat;
    inCategory.forEach((u) => {
      const option = document.createElement("option");
      option.value = u.key;
      option.textContent = u.label;
      group.appendChild(option);
    });
    selectEl.appendChild(group);
  });
}

// Area units offered by "Make your own": [key, singular, plural, square meters each]
const AREA_UNITS = [
  ["sqft", "square foot", "square feet", 0.09290304],
  ["sqyd", "square yard", "square yards", 0.83612736],
  ["sqm", "square meter", "square meters", 1],
  ["acre", "acre", "acres", 4046.8564224],
  ["hectare", "hectare", "hectares", 10000],
  ["sqkm", "square kilometer", "square kilometers", 1e6],
  ["sqmi", "square mile", "square miles", 2589988.110336]
];

// A <select> is normally as wide as its longest option -- size it to just
// the chosen option's text (plus its padding, which holds the arrow).
function fitSelectToContent(selectEl) {
  const probe = document.createElement("span");
  const cs = getComputedStyle(selectEl);
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;";
  probe.style.font = cs.font;
  probe.style.letterSpacing = cs.letterSpacing;
  probe.textContent = selectEl.options[selectEl.selectedIndex]?.text || "";
  document.body.appendChild(probe);
  const w = probe.getBoundingClientRect().width;
  probe.remove();
  selectEl.style.width = Math.ceil(w + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)) + "px";
}

// ---- Small-area meter<->degree helpers ----
function metersPerDeg(lat) {
  const rad = lat * Math.PI / 180;
  return {
    mPerDegLat: 111132.92,
    mPerDegLng: 111320.0 * Math.cos(rad)
  };
}

// Rotates local east/north-meter offsets by -bearing (so the shape stays
// upright on screen regardless of map rotation) and projects them to
// lng/lat around `centerLngLat`. Shared by every shape (rectangle,
// pentagon, ...) -- each shape only needs to supply its own local corners.
function localCornersToScreenVerticalRing(centerLngLat, localCorners, mapBearingDeg) {
  const [lng0, lat0] = centerLngLat;
  const { mPerDegLat, mPerDegLng } = metersPerDeg(lat0);

  const theta = (-mapBearingDeg) * Math.PI / 180;
  const cosT = Math.cos(theta);
  const sinT = Math.sin(theta);

  return localCorners.map(([x, y]) => {
    const xr = x * cosT - y * sinT; // east (meters)
    const yr = x * sinT + y * cosT; // north (meters)
    return [lng0 + xr / mPerDegLng, lat0 + yr / mPerDegLat];
  });
}

// Local EN (meters) corners of a widthM x heightM rectangle, centered at (0,0).
function rectangleLocalCorners(widthM, heightM) {
  const hw = widthM / 2;
  const hh = heightM / 2;
  return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh], [-hw, -hh]];
}

// Local EN (meters) corners of a regular polygon (given side count and side
// length), point-first-vertex-north, centered at (0,0) -- used for the
// Pentagon's actual 5-sided footprint instead of a rectangle approximation.
function regularPolygonLocalCorners(sideM, sides) {
  const R = sideM / (2 * Math.sin(Math.PI / sides)); // circumradius from side length
  const corners = [];
  for (let k = 0; k < sides; k++) {
    const theta = Math.PI / 2 + k * (2 * Math.PI / sides);
    corners.push([R * Math.cos(theta), R * Math.sin(theta)]);
  }
  corners.push(corners[0]);
  return corners;
}

function buildScreenVerticalRectangle(centerLngLat, widthM, heightM, mapBearingDeg) {
  return localCornersToScreenVerticalRing(centerLngLat, rectangleLocalCorners(widthM, heightM), mapBearingDeg);
}

function makeFieldFeature(map, widthM, heightM, shape, points) {
  const c = map.getCenter();              // <-- viewport center in lng/lat
  const center = [c.lng, c.lat];
  const bearing = map.getBearing();

  // Only the Pentagon unit uses "pentagon" so far -- widthM doubles as its
  // side length there (lengthM is unused/kept equal for that shape, since a
  // regular pentagon has only one degree of freedom).
  // "diamond" (baseball diamond) is a widthM-sided square standing on a corner.
  // "polygon" is a drawn shape, `points` its corners in local meters.
  const ring = shape === "polygon"
    ? localCornersToScreenVerticalRing(center, points, bearing)
    : shape === "pentagon"
    ? localCornersToScreenVerticalRing(center, regularPolygonLocalCorners(widthM, 5), bearing)
    : shape === "diamond"
    ? localCornersToScreenVerticalRing(center, regularPolygonLocalCorners(widthM, 4), bearing)
    : buildScreenVerticalRectangle(center, widthM, heightM, bearing);

  // close the ring
  ring.push(ring[0]);

  return {
    type: "Feature",
    properties: { label: "comparison shape (screen-centered, screen-vertical)" },
    geometry: { type: "Polygon", coordinates: [ring] }
  };
}

// Lines tiling the current unit across the whole view, lined up with the
// center shape and screen-vertical like it. A diamond's grid is turned 45°;
// a pentagon (which doesn't tile) gets a side-by-side square grid.
// When there would be too many lines to draw (a whole canyon in football fields, say), each square is drawn 10 by 10
// of the unit instead, or 100 by 100, and so on, until there are at most MAX_GRID_LINES; gridScale says how coarse
const MAX_GRID_LINES = 200;
let gridScale = 1;
function makeGridFeatures(map, widthM, heightM, shape) {
  const c = map.getCenter();
  const center = [c.lng, c.lat];
  const { mPerDegLat, mPerDegLng } = metersPerDeg(c.lat);
  const b = map.getBounds();
  const reach = Math.max(...[b.getNorthWest(), b.getNorthEast(), b.getSouthEast(), b.getSouthWest()]
    .map((p) => Math.hypot((p.lng - c.lng) * mPerDegLng, (p.lat - c.lat) * mPerDegLat)));

  const square = shape === "diamond" || shape === "pentagon";
  const fx = widthM;
  const fy = square ? widthM : heightM;
  gridScale = 1;
  while (2 * (reach / (fx * gridScale) + reach / (fy * gridScale)) > MAX_GRID_LINES) gridScale *= 10;
  const sx = fx * gridScale, sy = fy * gridScale; // each square, still lined up with the center shape
  const nx = Math.ceil(reach / sx) + 1;
  const ny = Math.ceil(reach / sy) + 1;

  const rot = shape === "diamond" ? Math.PI / 4 : 0;
  const turn = ([x, y]) => [x * Math.cos(rot) - y * Math.sin(rot), x * Math.sin(rot) + y * Math.cos(rot)];

  const lines = [];
  for (let i = -nx; i <= nx; i++) {
    const x = fx / 2 + i * sx;
    lines.push([[x, -reach], [x, reach]]);
  }
  for (let j = -ny; j <= ny; j++) {
    const y = fy / 2 + j * sy;
    lines.push([[-reach, y], [reach, y]]);
  }

  const bearing = map.getBearing();
  return lines.map((line) => ({
    type: "Feature",
    properties: {},
    geometry: { type: "LineString", coordinates: localCornersToScreenVerticalRing(center, line.map(turn), bearing) }
  }));
}

/// WGS84 lon/lat -> Web Mercator meters (EPSG:3857)
function lngLatToMercatorMeters(lng, lat) {
  const R = 6378137;
  const x = R * (lng * Math.PI / 180);
  const y = R * Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2));
  return [x, y];
}

function polygonAreaMeters2(coordsXY) {
  let area2 = 0;
  const n = coordsXY.length;
  for (let i = 0; i < n; i++) {
    const [x1, y1] = coordsXY[i];
    const [x2, y2] = coordsXY[(i + 1) % n];
    area2 += (x1 * y2 - x2 * y1);
  }
  return Math.abs(area2) / 2;
}

function computeFieldsInView(map, singleUnitAreaM2) {
  const canvas = map.getCanvas();
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;

  const nw = map.unproject([0, 0]);
  const ne = map.unproject([w, 0]);
  const se = map.unproject([w, h]);
  const sw = map.unproject([0, h]);

  const ringLngLat = [nw, ne, se, sw];
  const ringXY = ringLngLat.map(p => lngLatToMercatorMeters(p.lng, p.lat));

  // Area in Web Mercator "meters²" (distorted)
  const areaMercatorM2 = polygonAreaMeters2(ringXY);

  // Convert to approx ground area using local scale factor cos²(lat)
  const latRef = map.getCenter().lat;
  const cosLat = Math.cos(latRef * Math.PI / 180);
  const areaGroundM2 = areaMercatorM2 * (cosLat * cosLat);

  return {
    corners: { nw, ne, se, sw },
    areaGroundM2,
    fields: areaGroundM2 / singleUnitAreaM2
  };
}

function formatNumber(n) {
  const abs = Math.abs(n);

  if (abs < 1000) return (Math.round(n*10)/10).toString();

  if (abs < 1_000_000)
    return (n / 1_000).toFixed(1) + "K";

  if (abs < 1_000_000_000)
    return (n / 1_000_000).toFixed(1) + "M";

  return (n / 1_000_000_000).toFixed(1) + "B";
}

function wait(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

// Sets up the map experience inside `root`
// (a `.map-scrolly` element). Pass `showUnitSelector: true` to enable
// the comparison-unit dropdown for that instance only.
function initMapExperience(root, options) {
  const mapDiv = root.querySelector(".map");
  const fadeOverlay = root.querySelector(".fade-overlay");
  const textLabel = root.querySelector(".area-text");
  const measureUnit = root.querySelector(".measure-unit");
  const unitSelect = options.showUnitSelector ? root.querySelector(".unit-select") : null;
  const DEFAULT_UNIT = UNITS.find((u) => u.key === "football-field") || UNITS[0];
  if (unitSelect) {
    populateUnitSelect(unitSelect, UNITS);
    const makeOwn = document.createElement("option");
    makeOwn.value = "make-your-own";
    makeOwn.textContent = "Make your own…";
    unitSelect.appendChild(makeOwn);
    unitSelect.value = DEFAULT_UNIT.key;
    fitSelectToContent(unitSelect);
    document.fonts.ready.then(() => fitSelectToContent(unitSelect)); // re-measure once Inter has loaded
  }
  const placeSelect = root.querySelector(".place-select");
  const gridBtn = root.querySelector(".grid-btn");
  const customPopup = root.querySelector(".custom-popup");
  const customForm = root.querySelector(".area-form");
  const customNumber = root.querySelector(".custom-number");
  const customAreaUnit = root.querySelector(".custom-area-unit");
  AREA_UNITS.forEach(([key, , plural]) => {
    const option = document.createElement("option");
    option.value = key;
    option.textContent = plural;
    customAreaUnit.appendChild(option);
  });
  options.allPlaces.forEach((p, i) => {
    const option = document.createElement("option");
    option.value = String(i);
    option.textContent = p.name;
    placeSelect.appendChild(option);
  });
  // the note after the dropdown only belongs to Levi's Stadium
  const placeNote = root.querySelector(".place-note");
  function placeShown() {
    fitSelectToContent(placeSelect);
    placeNote.hidden = placeSelect.value !== "home";
  }
  fitSelectToContent(placeSelect);
  document.fonts.ready.then(() => fitSelectToContent(placeSelect));

  // Most-zoomed-in level at which the whole current unit still fits in the
  // window (with a small margin) -- a unit bigger than the window zooms out to this.
  function unitFitZoom() {
    const canvas = map.getCanvas();
    // on-screen width and height of the shape, in meters
    const [wM, hM] = currentUnit.shape === "pentagon"
      ? [widthM * 1.618, widthM * 1.539] // regular pentagon: diagonal wide, side x 1.539 tall
      : currentUnit.shape === "diamond"
      ? [widthM * Math.SQRT2, widthM * Math.SQRT2] // corner-to-corner
      : [widthM, heightM];
    const mPerPx = Math.max(wM / (0.9 * canvas.clientWidth), hM / (0.9 * canvas.clientHeight));
    const lat = map.getCenter().lat;
    return Math.log2(78271.517 * Math.cos(lat * Math.PI / 180) / mPerPx);
  }
  // Zoom out only if the unit doesn't fit at the current zoom.
  function zoomOutToFitUnit() {
    const fit = unitFitZoom();
    if (map.getZoom() > fit) map.easeTo({ zoom: fit, duration: 1400, essential: true });
  }

  let currentUnit = DEFAULT_UNIT;
  let { widthM, heightM } = unitFootprintMeters(currentUnit);

  const map = new mapboxgl.Map({
    container: mapDiv,
    style: options.style,
    center: options.initialCenter,
    zoom: options.initialZoom,
    bearing: options.initialBearing,
    pitch: 0,
    bearingSnap: 0 // otherwise Mapbox silently snaps any bearing within 7° of north to exactly 0
  });


  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "bottom-right");

  // Mouse or finger drags the map; the wheel, pinch and double-tap zoom
  // around the center (where the rectangle is). Rotating and tilting stay off.
  map.scrollZoom.enable({ around: "center" });
  map.touchZoomRotate.enable({ around: "center" });
  map.touchZoomRotate.disableRotation();
  map.doubleClickZoom.enable();
  map.dragRotate.disable();
  map.touchPitch.disable();
  map.keyboard.disable();
  map.boxZoom.disable();

  // Search box
  const geocoder = new MapboxGeocoder({
    accessToken: mapboxgl.accessToken,
    mapboxgl: mapboxgl,
    proximity: null,
    limit: 6,
    autocomplete: true,
    placeholder: "Search for a place"
  });
  map.addControl(geocoder, "bottom-left");
  // Added as a map control so it still moves the map on a result, then
  // moved into the "Measure any place..." sentence.
  root.querySelector(".place-search").appendChild(geocoder.container ?? root.querySelector(".mapboxgl-ctrl-geocoder"));

  // A searched place has no entry in the place dropdown -- add (or reuse)
  // one so "You are at ..." names it.
  geocoder.on("result", (e) => {
    // after the search's own fly-to, zoom out if the current unit doesn't fit
    map.once("moveend", zoomOutToFitUnit);
    let option = placeSelect.querySelector('option[value="search"]');
    if (!option) {
      option = document.createElement("option");
      option.value = "search";
      option.hidden = true;
      placeSelect.appendChild(option);
    }
    option.textContent = e.result.text;
    placeSelect.value = "search";
    placeShown();
  });


  function updateFieldsText() {
    measureUnit.textContent = currentUnit.plural;
    gridBtn.dataset.tip = "The grid is rectangles the size of the unit being used (" + currentUnit.singular + ").";
    const r = computeFieldsInView(map, unitAreaM2(currentUnit));
    textLabel.innerHTML =
      "The total map area you see on screen is about " +
      formatNumber(r.fields) + ' <span class="area-unit">' + currentUnit.plural + "</span>.";
  }

  map.on("load", () => {

    // Darkens the black-and-white map, drawn under the rectangle so the
    // rectangle stays bright; hidden along with the grayscale once a dropdown is used
    map.addSource("tint", {
      type: "geojson",
      data: {
        type: "Feature",
        geometry: { type: "Polygon", coordinates: [[[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]]] }
      }
    });
    map.addLayer({
      id: "tint",
      type: "fill",
      source: "tint",
      paint: { "fill-color": "#000", "fill-opacity": 0.4 }
    });

    map.addSource("grid", {
      type: "geojson",
      data: { type: "FeatureCollection", features: [] }
    });
    map.addLayer({
      id: "grid",
      type: "line",
      source: "grid",
      layout: { visibility: "none" },
      paint: { "line-color": "#fff", "line-width": 1.5 }
    });

    map.addSource("field", {
      type: "geojson",
      data: { type: "FeatureCollection", features: [makeFieldFeature(map, widthM, heightM, currentUnit.shape, currentUnit.points)] }
    });

    map.addLayer({
      id: "field-shadow",
      type: "line",
      source: "field",
      paint: {
        "line-color": "#000",
        "line-width": 20,
        "line-opacity": 0.4,
        "line-blur": 6
      }
    });

    map.addLayer({
      id: "field-fill",
      type: "fill",
      source: "field",
      paint: { "fill-color": "#ffcf01", "fill-opacity": 0 }
    });

    map.addLayer({
      id: "field-outline",
      type: "line",
      source: "field",
      paint: { "line-color": "#fff", "line-width": 8 }
    });

    // --- Update on any camera change (pan/zoom/rotate/pitch) ---
    let raf = null;
    let gridOn = false;
    function update() {
      raf = null;
      const src = map.getSource("field");
      if (!src) return;
      src.setData({
        type: "FeatureCollection",
        features: [makeFieldFeature(map, widthM, heightM, currentUnit.shape, currentUnit.points)]
      });
      if (gridOn) {
        map.getSource("grid").setData({
          type: "FeatureCollection",
          features: makeGridFeatures(map, widthM, heightM, currentUnit.shape)
        });
      }
      // a coarser grid says so
      const gridNote = document.querySelector(".grid-note");
      gridNote.hidden = !(gridOn && gridScale > 1);
      if (!gridNote.hidden) {
        gridNote.textContent = `Each grid square here is ${gridScale.toLocaleString()} × ${gridScale.toLocaleString()} ${currentUnit.plural || "units"}.`;
      }
    }

    gridBtn.addEventListener("click", () => {
      gridOn = !gridOn;
      gridBtn.textContent = gridOn ? "Hide grid" : "Show grid";
      map.setLayoutProperty("grid", "visibility", gridOn ? "visible" : "none");
      update();
    });

    const FADE_MS = 450;
    const ZOOM_IN_MS = 1400;

    // Fade-out/jump/fade-in camera move, used by the place dropdown.
    // `placeValue` is the place dropdown's option for where we're going
    // ("home" for the starting view, else an index into options.allPlaces).
    async function flyToPlace(target, placeValue) {
      // Hold at whatever zoom the last place left us at -- the zoom change
      // itself only happens once we've arrived, not during the pan.
      const holdZoom = map.getZoom();

      fadeOverlay.classList.add("visible");
      await wait(FADE_MS);

      // hidden behind the overlay: jump straight to the new spot, still at the old zoom
      map.jumpTo({ center: target.center, bearing: target.bearing, zoom: holdZoom });
      placeSelect.value = placeValue;
      placeShown();

      // fade back in, then ease from the old zoom to this place's own (in or out),
      // or further out if the current unit wouldn't fit at the place's zoom
      fadeOverlay.classList.remove("visible");
      map.easeTo({ zoom: Math.min(target.zoom, unitFitZoom()), duration: ZOOM_IN_MS, essential: true });
    }

    function showColor() {
      mapDiv.classList.remove("grayscale");
      map.setLayoutProperty("tint", "visibility", "none");
    }

    if (unitSelect) {
      // Stay where we are: redraw the shape, zooming out only if it no longer fits.
      function useUnit(unit) {
        showColor();
        currentUnit = unit;
        unitSelect.value = unit.key;
        fitSelectToContent(unitSelect);
        ({ widthM, heightM } = unitFootprintMeters(currentUnit));
        update();
        updateFieldsText();
        zoomOutToFitUnit();
      }

      // The unit made in the popup: a square of the chosen area, or a drawn shape.
      let customUnit = null;

      function setCustomUnit(unit) {
        customUnit = unit;
        let option = unitSelect.querySelector('option[value="custom"]');
        if (!option) {
          option = document.createElement("option");
          option.value = "custom";
          unitSelect.insertBefore(option, unitSelect.querySelector('option[value="make-your-own"]'));
        }
        option.textContent = unit.label;
        customPopup.hidden = true;
        useUnit(unit);
      }

      // --- popup tabs ---
      let activeTab = "area";
      const tabButtons = root.querySelectorAll(".custom-tabs button");
      function showTab(name) {
        activeTab = name;
        tabButtons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tab === name)));
        root.querySelectorAll(".custom-form").forEach((f) => { f.hidden = f.dataset.panel !== name; });
        if (name === "draw") openDrawMap();
      }
      tabButtons.forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));

      // --- "Draw a shape" tab: click corners on a second map ---
      const drawForm = root.querySelector(".draw-form");
      const drawName = root.querySelector(".draw-name");
      const drawHint = root.querySelector(".draw-hint");
      let drawMap = null;
      let drawPoints = []; // [lng, lat] corners, in click order

      function drawnData() {
        const features = drawPoints.map((p) => ({ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: p } }));
        if (drawPoints.length >= 2) {
          features.push({
            type: "Feature",
            properties: {},
            geometry: drawPoints.length >= 3
              ? { type: "Polygon", coordinates: [[...drawPoints, drawPoints[0]]] }
              : { type: "LineString", coordinates: drawPoints }
          });
        }
        return { type: "FeatureCollection", features };
      }

      function redrawDrawn() {
        const src = drawMap && drawMap.getSource("drawn");
        if (src) src.setData(drawnData());
      }

      // Made the first time the tab is opened (a map can't size itself while hidden),
      // starting where the main map is.
      function openDrawMap() {
        if (drawMap) { drawMap.resize(); return; }
        drawMap = new mapboxgl.Map({
          container: root.querySelector(".draw-map"),
          style: options.style,
          center: map.getCenter(),
          zoom: map.getZoom(),
          bearing: 0
        });
        drawMap.doubleClickZoom.disable(); // double clicks add corners instead
        drawMap.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "bottom-right");
        drawMap.on("load", () => {
          drawMap.addSource("drawn", { type: "geojson", data: drawnData() });
          drawMap.addLayer({
            id: "drawn-fill", type: "fill", source: "drawn",
            filter: ["==", ["geometry-type"], "Polygon"],
            paint: { "fill-color": "#fff", "fill-opacity": 0.25 }
          });
          drawMap.addLayer({
            id: "drawn-line", type: "line", source: "drawn",
            filter: ["!=", ["geometry-type"], "Point"],
            paint: { "line-color": "#fff", "line-width": 3 }
          });
          drawMap.addLayer({
            id: "drawn-points", type: "circle", source: "drawn",
            filter: ["==", ["geometry-type"], "Point"],
            paint: { "circle-radius": 5, "circle-color": "#fff", "circle-stroke-color": "#000", "circle-stroke-width": 1.5 }
          });
        });
        drawMap.on("click", (e) => {
          drawPoints.push([e.lngLat.lng, e.lngLat.lat]);
          drawHint.textContent = "Click on the map to add corners.";
          redrawDrawn();
        });
      }

      root.querySelector(".draw-undo").addEventListener("click", () => { drawPoints.pop(); redrawDrawn(); });
      root.querySelector(".draw-clear").addEventListener("click", () => { drawPoints = []; redrawDrawn(); });

      drawForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = drawName.value.trim() || "your shape";
        if (drawPoints.length < 3) { drawHint.textContent = "Add at least 3 corners."; return; }

        // corners -> local east/north meters, centered on the shape's bounding box
        const lng0 = drawPoints.reduce((a, p) => a + p[0], 0) / drawPoints.length;
        const lat0 = drawPoints.reduce((a, p) => a + p[1], 0) / drawPoints.length;
        const { mPerDegLat, mPerDegLng } = metersPerDeg(lat0);
        let pts = drawPoints.map(([lng, lat]) => [(lng - lng0) * mPerDegLng, (lat - lat0) * mPerDegLat]);
        const xs = pts.map((p) => p[0]);
        const ys = pts.map((p) => p[1]);
        const minX = Math.min(...xs), maxX = Math.max(...xs);
        const minY = Math.min(...ys), maxY = Math.max(...ys);
        pts = pts.map(([x, y]) => [x - (minX + maxX) / 2, y - (minY + maxY) / 2]);

        setCustomUnit({
          key: "custom",
          label: name,
          singular: name,
          plural: name,
          shape: "polygon",
          points: pts,
          areaM2: polygonAreaMeters2(pts),
          widthM: maxX - minX,
          lengthM: maxY - minY
        });
      });

      unitSelect.addEventListener("change", () => {
        if (unitSelect.value === "make-your-own") {
          // keep showing the current unit until the popup is submitted
          unitSelect.value = currentUnit.key;
          fitSelectToContent(unitSelect);
          customPopup.hidden = false;
          if (activeTab === "draw") {
            openDrawMap();
          } else {
            customNumber.focus();
            customNumber.select();
          }
          return;
        }
        useUnit(unitSelect.value === "custom" ? customUnit : (UNITS.find((u) => u.key === unitSelect.value) || UNITS[0]));
      });

      customForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const n = Number(customNumber.value);
        if (!(n > 0)) return;
        const [, one, many, m2] = AREA_UNITS.find((a) => a[0] === customAreaUnit.value);
        const amount = n.toLocaleString() + " " + (n === 1 ? one : many);
        const side = Math.sqrt(n * m2);
        setCustomUnit({
          key: "custom",
          label: amount,
          singular: amount,
          plural: amount,
          widthM: side,
          lengthM: side
        });
      });

      function closeCustomPopup() { customPopup.hidden = true; }
      root.querySelectorAll(".custom-cancel").forEach((b) => b.addEventListener("click", closeCustomPopup));
      customPopup.addEventListener("click", (e) => { if (e.target === customPopup) closeCustomPopup(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeCustomPopup(); });
    }

    placeSelect.addEventListener("change", () => {
      showColor();
      if (placeSelect.value === "home") {
        flyToPlace({ center: options.initialCenter, zoom: options.initialZoom, bearing: options.initialBearing }, "home");
        return;
      }
      const p = options.allPlaces[Number(placeSelect.value)];
      flyToPlace({ center: [p.lng, p.lat], zoom: p.zoom ?? 15, bearing: p.bearing || 0 }, placeSelect.value);
    });

    // 'move' fires for pan/zoom/rotate/pitch continuously
    map.on("move", () => {
      if (raf) return;
      raf = requestAnimationFrame(update);
    });
  });

  map.on("load", updateFieldsText);
  map.on("moveend", updateFieldsText);
}

// Place and unit data (name/lat/lng/zoom/bearing) lives in places.json and
// units.json, both tuned with football_tester.html, rather than inline here.
Promise.all([
  fetch("places.json").then((r) => r.json()),
  fetch("units.json").then((r) => r.json())
]).then(([places, units]) => {
    UNITS = units;

    initMapExperience(document.getElementById("map-scrolly-2"), {
      style: STYLE,
      initialCenter: INITIAL_CENTER,
      initialZoom: 17,
      initialBearing: -29,
      allPlaces: places,
      showUnitSelector: true
    });
  });
</script>
</body>
</html>
