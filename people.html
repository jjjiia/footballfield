<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>People</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <style>
    .scroll-visual{
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }
    .scroll-visual svg, .scroll-visual canvas{
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .axis-line{ stroke: #000; stroke-width: 1px; }
    .tick-line{ stroke: #000; stroke-width: 1px; }
    .tick-text{ fill: #000; font-family: 'Open Sans', sans-serif; font-size: 11px; }
    .anchor-label{
      font-family: 'Open Sans', sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #111;
      pointer-events: none;
    }
    .anchor-value{
      font-family: 'Open Sans', sans-serif;
      font-weight: 400;
      font-size: 11px;
      fill: #555;
      pointer-events: none;
    }

    .caption-box{
      position: absolute;
      top: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Open Sans', sans-serif;
      pointer-events: none;
    }
    .caption-title{ font-weight: 700; font-size: 20px; color: #000; }
    .caption-subtitle{ font-weight: 400; font-size: 13px; color: #666; margin-top: 4px; }

    .scene-nav{
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 16px;
      pointer-events: none;
    }
    .scene-nav .scene-tick{
      display: flex;
      align-items: center;
      gap: 8px;
      color: #bbb;
      font-family: 'Open Sans', sans-serif;
      font-size: 11px;
      transition: color 0.2s ease;
    }
    .scene-nav .scene-tick .mark{
      width: 14px;
      height: 1px;
      background: #bbb;
      transition: background 0.2s ease, width 0.2s ease, height 0.2s ease;
    }
    .scene-nav .scene-tick.active{
      color: #000;
      font-weight: 700;
    }
    .scene-nav .scene-tick.active .mark{
      background: #000;
      width: 20px;
      height: 2px;
    }

    .search-box{
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: min(360px, 80vw);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-family: 'Open Sans', sans-serif;
      z-index: 4;
      pointer-events: auto;
    }
    .search-box.active{ display: flex; }
    .search-box input{
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }
    .search-box input:focus{ border-color: #888; }
    .search-suggestions{
      width: 100%;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      max-height: 220px;
      overflow-y: auto;
    }
    .search-suggestions:empty{ display: none; }
    .search-suggestions .suggestion{
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .search-suggestions .suggestion:hover{ background: #f2f2f2; }
    .search-suggestions .suggestion .s-value{ color: #888; white-space: nowrap; }
    .search-hint{ font-size: 11px; color: #999; font-style: italic; }

    #tooltip{
      position: fixed;
      pointer-events: none;
      background: #111;
      color: #fff;
      font-family: 'Open Sans', sans-serif;
      font-size: 12px;
      padding: 6px 9px;
      border-radius: 6px;
      max-width: 260px;
      opacity: 0;
      transition: opacity 0.1s ease;
      z-index: 10;
    }
    #tooltip .tt-value{ font-weight: 700; }
    #tooltip .tt-title{ color: #ccc; }

    /* Purely a scroll-trigger measuring stick, no visible or interactive
       content of its own -- without this, it being positioned and later in
       the DOM than .scroll-visual made it paint (and capture clicks/focus)
       on top of the sticky visual for the entire scroll, including the
       search box. */
    .scroll-steps{ position: relative; pointer-events: none; }
    .scroll-step{ height: 100vh; }
  </style>
</head>
<body>

  <div class="scroll-visual" id="scroll-visual">
    <canvas id="dots-canvas"></canvas>
    <svg id="axis-svg"></svg>
    <div class="caption-box">
      <div class="caption-title" id="caption-title"></div>
      <div class="caption-subtitle" id="caption-subtitle"></div>
    </div>
    <div class="search-box" id="search-box">
      <input type="text" id="search-input" placeholder="Search anything in this dataset&hellip;" autocomplete="off" />
      <div class="search-suggestions" id="search-suggestions"></div>
      <div class="search-hint">Pick a result to drop it onto the line</div>
    </div>
    <div class="scene-nav" id="scene-nav"></div>
  </div>
  <div class="scroll-steps" id="scroll-steps"></div>
  <div id="tooltip"></div>

  <script src="people_scenes_config.js"></script>

        activeNodes.push(d);
        added = true;
      }
      if (added) {
        simulation.nodes(activeNodes);
        wake(0.5);
      }
    }

    function enterScene(sceneIdx, animate) {
      const toAdd = [];
      const toRemove = [];
      items.forEach(d => {
        const newTargetX = x(d.v);
        const { visible, anchor } = itemState(d, sceneIdx);
        d.r = anchor ? 4 : 3.2;
        d.isAnchorNow = anchor;

        const isNewlyRevealed = visible && !d.everVisible;
        if (!isNewlyRevealed) {
          // A newly-revealed item's opacity/radius targets are set only once
          // it's actually released to fall (below) -- setting them here
          // would make it fade in at its old, stale position well before its
          // staggered turn comes up.
          d.targetOpacity = visible ? freshOpacity(d, sceneIdx) : 0;
          d.targetR = visible ? d.r : 0;
        }

        // An already-settled item whose x actually moves because the
        // scene's domain zoomed gets an explicit tween (handled in the
        // render loop) instead of being left to the physics spring.
        if (visible && d.everVisible && !isNewlyRevealed && d.targetX !== newTargetX) {
          d.xTweenFrom = d.x;
          d.xTweenTo = newTargetX;
          d.xTweenStart = performance.now();
        }
        d.targetX = newTargetX;

        if (isNewlyRevealed) {
          d.everVisible = true;
          toAdd.push(d);
        } else if (!visible && d.everVisible) {
          d.everVisible = false;
          toRemove.push(d);
        }
      });

      if (toRemove.length) {
        const removeSet = new Set(toRemove);
        activeNodes = activeNodes.filter(d => !removeSet.has(d));
        revealQueue = revealQueue.filter(d => !removeSet.has(d));
        simulation.nodes(activeNodes);
      }

      if (toAdd.length) {
        if (animate) {
          scheduleEntries(toAdd);
        } else {
          // Initial load / resize: place instantly, no staggered fall.
          toAdd.forEach(d => {
            d.x = d.targetX;
            d.y = axisY - d.r;
            d.vx = 0;
            d.vy = 0;
            d.falling = false;
            d.revealedInScene = sceneIdx;
            d.targetOpacity = freshOpacity(d, sceneIdx);
            d.targetR = d.r;
          });
          activeNodes.push(...toAdd);
          simulation.nodes(activeNodes);
        }
      }

      wake(0.4);
    }

    // Picks a "nice" (1/2/5 x a power of ten) tick step scaled to the
    // domain's span, aiming for roughly a dozen ticks -- needed once scenes
    // started spanning anywhere from 100M (a tight zoom) up to 60B (the
    // final scale-out), since a single fixed step can't suit both.
    function niceTickStep(span, targetCount) {
      const raw = span / targetCount;
      const magnitude = Math.pow(10, Math.floor(Math.log10(raw)));
      const norm = raw / magnitude;
      const niceNorm = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
      return niceNorm * magnitude;
    }

    function renderAxis(domain, animate) {
      const [lo, hi] = domain;
      const span = hi - lo;
      // A narrow zoomed-in domain (e.g. scene 1's 300M-400M) gets a finer
      // step so it isn't left with just its two boundary ticks; every
      // domain up through the original 1.5B max keeps the plain 100M step
      // it always has. Only a domain bigger than that (the 60B finale)
      // needs to scale its step up too, or it'd end up with hundreds of
      // ticks at a fixed 100M spacing.
      const step = span <= 100e6 ? 50e6 : span <= 1500e6 ? 100e6 : niceTickStep(span, 12);
      const tickValues = [];
      const start = Math.floor(lo / step) * step;
      for (let v = start; v <= hi + 1; v += step) tickValues.push(v);

      const ticks = axisLayer.selectAll(".tick-group").data(tickValues, v => v);
      // A brand-new tick slides in from the side its value implies on the
      // (linear) number line -- smaller than the original zoomed-in range
      // comes from the left, bigger comes from the right -- not from
      // whichever screen half it happens to land in pixel-wise.
      const ticksEnter = ticks.enter().append("g").attr("class", "tick-group")
        .attr("transform", v => {
          let fromPx;
          if (v < 300e6) fromPx = -30;
          else if (v > 400e6) fromPx = width + 30;
          else fromPx = x(v) < width / 2 ? -30 : width + 30;
          return `translate(${fromPx},0)`;
        })
        .style("opacity", 0);
      ticksEnter.append("line").attr("class", "tick-line").attr("y1", axisY - 6).attr("y2", axisY + 6);
      ticksEnter.append("text").attr("class", "tick-text").attr("y", axisY + 20).attr("text-anchor", "middle").text(formatTick);

      // Cubic ease-out (fast start, decelerating) reads much closer to the
      // physics-driven dots' spring motion than the default ease-in-out,
      // which was the main source of the two feeling out of sync.
      const ticksMerge = ticksEnter.merge(ticks);
      (animate ? ticksMerge.transition().duration(800).ease(d3.easeCubicOut) : ticksMerge)
        .attr("transform", v => `translate(${x(v)},0)`)
        .style("opacity", 1);

      ticks.exit().transition().duration(400).style("opacity", 0).remove();
    }

    // Up to 4 items ever get a permanent visible label (the anchors); each
    // gets its own persistent <text> pair shown only while it's the anchor.
    function renderAnchorLabels(sceneIdx, animate) {
      const anchorItems = items.filter(d => itemIsAnchor(d, sceneIdx));
      const sel = labelLayer.selectAll(".anchor-group").data(anchorItems, d => d.q + d.p);
      const enter = sel.enter().append("g").attr("class", "anchor-group")
        .attr("transform", d => `translate(${d.x},${d.y - 23})`)
        .style("opacity", 0);
      enter.append("text").attr("class", "anchor-label").attr("text-anchor", "middle").text(d => d.t);
      enter.append("text").attr("class", "anchor-value").attr("y", 14).attr("text-anchor", "middle").text(d => formatValue(d.v));

      // Position itself is driven every frame by the simulation's tick
      // handler above -- only fade opacity here.
      const merged = enter.merge(sel);
      anchorLabelSel = merged;
      (animate ? merged.transition().duration(400) : merged).style("opacity", 1);

      sel.exit().transition().duration(400).style("opacity", 0).remove();
    }

    let currentScene = -1;
    function applyScene(sceneIdx, animate) {
      if (sceneIdx === currentScene) return;
      currentScene = sceneIdx;

      x.domain(SCENES[sceneIdx].domain);
      renderAxis(SCENES[sceneIdx].domain, animate);
      enterScene(sceneIdx, animate);
      renderAnchorLabels(sceneIdx, animate);
      renderSceneNav(sceneIdx);

      const caption = SCENES[sceneIdx].caption;
      document.getElementById("caption-title").textContent = caption.title;
      document.getElementById("caption-subtitle").textContent = caption.subtitle;
      searchBoxEl.classList.toggle("active", !!SCENES[sceneIdx].search);
      // Dot radius/opacity targets were already set in enterScene(); the
      // canvas render loop eases toward them every frame on its own.
    }

    const stepsContainer = document.getElementById("scroll-steps");
    const steps = [];
    for (let s = 1; s < NUM_SCENES; s++) {
      const step = document.createElement("div");
      step.className = "scroll-step";
      step.dataset.scene = String(s);
      stepsContainer.appendChild(step);
      steps.push(step);
    }

    let ticking = false;
    function updateScene() {
      ticking = false;
      const half = window.innerHeight / 2;
      let activeScene = 0;
      for (let s = 0; s < steps.length; s++) {
        if (steps[s].getBoundingClientRect().top < half) activeScene = s + 1;
      }
      applyScene(activeScene, true);
    }
    function onScroll() {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(updateScene);
      }
    }

    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", () => {
      width = window.innerWidth;
      height = window.innerHeight;
      axisY = height * AXIS_Y_FRAC;
      fitCanvas();
      x.range([MARGIN_LEFT, width - MARGIN_RIGHT]);
      axisLayer.select(".axis-line").attr("x1", 0).attr("x2", width).attr("y1", axisY).attr("y2", axisY);
      const sceneToReapply = currentScene;
      currentScene = -1;
      applyScene(Math.max(0, sceneToReapply), false);
    });

    applyScene(0, false);
  </script>
</body>
</html>
